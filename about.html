<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>About | megameter.com</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="preload" as="image" href="prospectus/previews/a07_image.jpg">
  <link rel="preload" as="image" href="prospectus/previews/a08_image.jpg" fetchpriority="low">
  <link rel="preload" as="image" href="prospectus/previews/a09_image.jpg" fetchpriority="low">
  <link rel="preload" as="image" href="prospectus/previews/a10_image.jpg" fetchpriority="low">
  <link rel="preload" as="image" href="prospectus/previews/a11_image.jpg" fetchpriority="low">
  <link rel="preload" as="image" href="prospectus/previews/a12_image.jpg" fetchpriority="low">
  <link rel="preload" as="image" href="prospectus/previews/a13_image.jpg" fetchpriority="low">
  <link rel="preload" as="image" href="prospectus/previews/a15_image.jpg" fetchpriority="low">
  <style>
    body {
      height: auto;
      overflow-y: auto;
    }

    .about-content {
      position: relative;
      z-index: 1;
      width: min(100% - 32px, 800px);
      margin: 0 auto;
      padding: 80px 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 60px;
    }

    .gallery {
      display: flex;
      flex-direction: column;
      gap: 40px;
      width: 100%;
    }

    .gallery img {
      width: 100%;
      height: auto;
      border-radius: 12px;
      border: 1px solid var(--line);
      box-shadow: var(--shadow);
      background: var(--panel);
      content-visibility: auto;
      opacity: 0;
      transform: translateY(20px);
      transition: opacity 0.8s ease-out, transform 0.8s ease-out, filter 0.4s ease-out;
    }

    .gallery img.is-preview {
      filter: blur(3px);
    }

    .gallery img.loaded {
      opacity: 1;
      transform: translateY(0);
    }

    .info-section {
      text-align: center;
      max-width: 650px;
    }

    .about-title-section h1 {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 3rem;
      color: var(--gold);
      margin: 0;
    }

    .info-section p {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 1.1rem;
      line-height: 1.6;
      color: var(--muted);
      text-align: left;
      margin-bottom: 1.5rem;
    }

    .info-section p:last-child {
      margin-bottom: 0;
    }

    .back-home {
      margin-top: 40px;
    }
  </style>
</head>

<body>
  <div class="background-layer" aria-hidden="true">
    <div class="breathing-orb"></div>
  </div>

  <main class="about-content">
    <section class="info-section about-title-section">
      <h1 id="about-title"></h1>
    </section>

    <div class="gallery" id="gallery-root">
      <!-- Dynamically populated -->
    </div>

    <section class="info-section">
      <div id="about-text"></div>
    </section>

    <div class="back-home">
      <a href="index.html" class="footer a">Return to divine intellect</a>
    </div>
  </main>

  <footer class="footer">
    <div><span aria-hidden="true">&copy;</span> megameter inc. 2026</div>
  </footer>

  <script type="module">
    import { aboutTitle, prospectusImages } from './consts/about.js';

    // Inject Text Content
    document.getElementById('about-title').textContent = aboutTitle;
    fetch('consts/about.md')
      .then(response => response.text())
      .then(text => {
        // Robust Markdown-style processing:
        // 1. Split by blank lines (double newlines or lines with only spaces)
        // 2. In each paragraph, replace single newlines with spaces
        // 3. Wrap each paragraph in <p> tags
        const paragraphs = text
          .trim()
          .split(/\n\s*\n/)
          .map(p => `<p>${p.replace(/\n/g, ' ').trim()}</p>`);

        document.getElementById('about-text').innerHTML = paragraphs.join('');
      });

    // Dynamically Build Gallery
    const gallery = document.getElementById('gallery-root');
    const placeholderSrc = 'data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 4 5"%3E%3Crect width="4" height="5" fill="%23202124"/%3E%3C/svg%3E';

    prospectusImages.forEach((image, index) => {
      const img = document.createElement('img');
      const fullSrc = `prospectus/${image.src}`;
      const previewSrc = `prospectus/previews/${image.src}`;
      img.src = placeholderSrc;
      img.width = image.width;
      img.height = image.height;
      img.alt = `Prospectus visual ${index + 1}`;
      img.decoding = 'async';
      img.loading = index < 2 ? 'eager' : 'lazy';
      img.fetchPriority = index === 0 ? 'high' : 'auto';
      img.classList.add('is-preview');

      const loadPreviewImage = () => {
        const previewImage = new Image();
        previewImage.decoding = 'async';
        previewImage.onload = () => {
          if (!hasRequestedFullImage) {
            img.src = previewSrc;
          }
        };
        previewImage.src = previewSrc;
      };

      let hasRequestedFullImage = false;
      const loadFullImage = () => {
        if (hasRequestedFullImage) {
          return;
        }

        hasRequestedFullImage = true;
        const fullImage = new Image();
        fullImage.decoding = 'async';
        fullImage.onload = () => {
          img.src = fullSrc;
          img.classList.remove('is-preview');
        };
        fullImage.src = fullSrc;
      };

      gallery.appendChild(img);
      loadPreviewImage();

      if (!('IntersectionObserver' in window)) {
        img.classList.add('loaded');
        loadFullImage();
        return;
      }

      // Add fade-in effect and high-res upgrade when image approaches viewport
      const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            img.classList.add('loaded');
            loadFullImage();
            observer.unobserve(img);
          }
        });
      }, { rootMargin: '360px 0px', threshold: 0.01 });

      observer.observe(img);
    });
  </script>
</body>

</html>
